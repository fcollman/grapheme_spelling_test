name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Build jobs stay read-only; deploy and preview jobs request the extra
# permissions they need when they publish through GitHub Pages deployments.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The embedded eSpeak engine inflates its data with DecompressionStream,
          # which needs Node 18 or newer.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Check the phonics reference is up to date
        run: |
          npm run reference
          if ! git diff --quiet -- PHONEME-CATEGORIES.md; then
            echo "::error::PHONEME-CATEGORIES.md is stale. Run 'npm run reference' and commit the result."
            git diff -- PHONEME-CATEGORIES.md
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check the build is a single self-contained file
        run: npm run check:single

      # So a PR build can be downloaded and opened locally without deploying.
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapheme-spelling-test-html
          path: dist/index.html
          if-no-files-found: error

  preview:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - uses: actions/configure-pages@v5

      - name: Assemble the Pages site with this preview
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          site_dir="$RUNNER_TEMP/pages-site"
          manifest="$RUNNER_TEMP/pages-previews.json"

          rm -rf "$site_dir"
          mkdir -p "$site_dir/pr-preview/pr-${PR}"

          if ! curl --fail --silent --show-error --location \
            "${base_url}/index.html" \
            --output "$site_dir/index.html"; then
            echo "::warning::Could not fetch the live site; using this build as the root page until main deploy runs."
            cp dist/index.html "$site_dir/index.html"
          fi

          existing_previews=()
          if curl --fail --silent --show-error --location \
            "${base_url}/pr-preview/previews.json" \
            --output "$manifest"; then
            mapfile -t existing_previews < <(
              python - "$manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              for pr in json.load(f).get("pull_requests", []):
                  print(pr)
          PY
            )
          fi

          for existing_pr in "${existing_previews[@]}"; do
            if [ "$existing_pr" = "$PR" ]; then
              continue
            fi

            target_dir="$site_dir/pr-preview/pr-${existing_pr}"
            mkdir -p "$target_dir"
            if ! curl --fail --silent --show-error --location \
              "${base_url}/pr-preview/pr-${existing_pr}/index.html" \
              --output "$target_dir/index.html"; then
              echo "::warning::Skipping missing preview for PR #${existing_pr}."
              rm -rf "$target_dir"
            fi
          done

          cp dist/index.html "$site_dir/pr-preview/pr-${PR}/index.html"

          python - "$site_dir/pr-preview/previews.json" "${existing_previews[@]}" "$PR" <<'PY'
          import json
          import sys
          
          prs = sorted({int(value) for value in sys.argv[2:] if value.strip()})
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({"pull_requests": prs}, f, indent=2)
              f.write("\n")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      # ---- PR preview -------------------------------------------------------
      #
      # Reviewing a change used to mean opening the Actions run, finding the
      # artifact, downloading a zip and unzipping it. Since the build is one
      # self-contained file, it can just be published and linked instead.
      #
      # The workflow republishes the whole Pages artifact, keeping the current
      # live root plus every known PR preview directory.
      - name: Deploy the updated Pages site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the preview from the pull request
        id: preview-comment
        env:
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}/pr-preview/pr-${PR}/"
          {
            echo "body<<EOF"
            cat <<EOF
          ### Preview this build

          **[Open the app in your browser](${preview_url})** — built from this branch, nothing to download.

          Or **[download index.html](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${ARTIFACT_ID})** to open it offline. It is one self-contained file.

          <sub>Rebuilt on every push to this pull request. The preview updates its own PR path without changing the published root page.</sub>
          EOF
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: preview-link
          message: ${{ steps.preview-comment.outputs.body }}

  deploy:
    # Only publish the live site from main; PRs publish under pr-preview/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - uses: actions/configure-pages@v5

      - name: Assemble the Pages site with the live build
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          site_dir="$RUNNER_TEMP/pages-site"
          manifest="$RUNNER_TEMP/pages-previews.json"

          rm -rf "$site_dir"
          mkdir -p "$site_dir/pr-preview"
          cp dist/index.html "$site_dir/index.html"

          existing_previews=()
          if curl --fail --silent --show-error --location \
            "${base_url}/pr-preview/previews.json" \
            --output "$manifest"; then
            mapfile -t existing_previews < <(
              python - "$manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              for pr in json.load(f).get("pull_requests", []):
                  print(pr)
          PY
            )
          fi

          kept_previews=()
          for existing_pr in "${existing_previews[@]}"; do
            target_dir="$site_dir/pr-preview/pr-${existing_pr}"
            mkdir -p "$target_dir"
            if curl --fail --silent --show-error --location \
              "${base_url}/pr-preview/pr-${existing_pr}/index.html" \
              --output "$target_dir/index.html"; then
              kept_previews+=("$existing_pr")
            else
              echo "::warning::Skipping missing preview for PR #${existing_pr}."
              rm -rf "$target_dir"
            fi
          done

          python - "$site_dir/pr-preview/previews.json" "${kept_previews[@]}" <<'PY'
          import json
          import sys
          
          prs = sorted({int(value) for value in sys.argv[2:] if value.strip()})
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({"pull_requests": prs}, f, indent=2)
              f.write("\n")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
