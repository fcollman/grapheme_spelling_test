name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Build jobs stay read-only; deploy and preview jobs request the extra
# permissions they need when they publish through GitHub Pages deployments.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The embedded eSpeak engine inflates its data with DecompressionStream,
          # which needs Node 18 or newer.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Check the phonics reference is up to date
        run: |
          npm run reference
          if ! git diff --quiet -- PHONEME-CATEGORIES.md; then
            echo "::error::PHONEME-CATEGORIES.md is stale. Run 'npm run reference' and commit the result."
            git diff -- PHONEME-CATEGORIES.md
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check the build is a single self-contained file
        run: npm run check:single

      # So a PR build can be downloaded and opened locally without deploying.
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: grapheme-spelling-test-html
          path: dist/index.html
          if-no-files-found: error

  deploy:
    # Only publish the live site from main; PRs publish under pr-preview/.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - id: pages
        uses: actions/configure-pages@v5

      - name: Assemble the Pages site with the live build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          base_url="$BASE_URL"
          site_dir="$RUNNER_TEMP/pages-site"
          manifest="$RUNNER_TEMP/pages-previews.json"

          rm -rf "$site_dir"
          mkdir -p "$site_dir/pr-preview"
          cp dist/index.html "$site_dir/index.html"

          existing_previews=()
          if curl --fail --silent --show-error --location \
            "${base_url}/pr-preview/previews.json" \
            --output "$manifest"; then
            mapfile -t existing_previews < <(
              python - "$manifest" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          for pr in data.get("pull_requests", []):
              try:
                  print(int(pr))
              except (TypeError, ValueError):
                  pass
          PY
            )
          fi

          kept_previews=()
          for existing_pr in "${existing_previews[@]}"; do
            target_dir="$site_dir/pr-preview/pr-${existing_pr}"
            mkdir -p "$target_dir"
            if curl --fail --silent --show-error --location \
              "${base_url}/pr-preview/pr-${existing_pr}/index.html" \
              --output "$target_dir/index.html"; then
              kept_previews+=("$existing_pr")
            else
              echo "::warning::Skipping missing preview for PR #${existing_pr}."
              rm -rf "$target_dir"
            fi
          done

          python - "$site_dir/pr-preview/previews.json" "${kept_previews[@]}" <<'PY'
          import json
          import sys
          
          prs = sorted({int(value) for value in sys.argv[2:] if value.strip()})
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump({"pull_requests": prs}, f, indent=2)
              f.write("\n")
          PY

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - id: deployment
        uses: actions/deploy-pages@v4
